<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 564" width="860" height="564" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="The SPI flash, 1 MiB">
<rect width="860" height="564" rx="10" fill="#0b0b0c"/>
<text x="20" y="34" fill="#ececec" font-size="17" font-weight="700" text-anchor="start">The SPI flash, 1 MiB</text>
<text x="20" y="54" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">Everything the unit needs to start. Offsets in bytes; sectors are 4 KiB.</text>
<line x1="20" y1="66" x2="840" y2="66" stroke="#2c2c30"/>
<text x="20" y="99" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">0x00000</text>
<rect x="122" y="82" width="268" height="42" rx="4" fill="#5f5f66" fill-opacity="0.16" stroke="#5f5f66" stroke-width="1.5"/>
<text x="134" y="99" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">First stage</text>
<text x="380" y="99" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="end">44 KiB</text>
<text x="408" y="99" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">The unit's own first loader. It reads the selector,</text>
<text x="408" y="116" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">checks the slot and starts it. waffle-boot leaves it.</text>
<text x="20" y="145" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">0x0B000</text>
<rect x="122" y="128" width="268" height="22" rx="4" fill="#6cb6ff" fill-opacity="0.16" stroke="#6cb6ff" stroke-width="1.5"/>
<text x="134" y="145" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">Metadata mirror</text>
<text x="380" y="145" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="end">4 KiB</text>
<text x="408" y="145" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">A second copy, kept only while the record is written.</text>
<text x="20" y="171" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">0x0C000</text>
<rect x="122" y="154" width="268" height="22" rx="4" fill="#6cb6ff" fill-opacity="0.16" stroke="#6cb6ff" stroke-width="1.5"/>
<text x="134" y="171" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">Metadata</text>
<text x="380" y="171" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="end">4 KiB</text>
<text x="408" y="171" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">Serial number and calibration. Written by an OS install.</text>
<text x="20" y="197" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">0x0D000</text>
<rect x="122" y="180" width="268" height="22" rx="4" fill="#ffb000" fill-opacity="0.16" stroke="#ffb000" stroke-width="1.5"/>
<text x="134" y="197" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">Selector</text>
<text x="380" y="197" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="end">4 KiB</text>
<text x="408" y="197" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">Which slot starts, and whether it is trusted.</text>
<text x="20" y="223" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">0x0E000</text>
<rect x="122" y="206" width="268" height="22" rx="4" fill="#ffb000" fill-opacity="0.16" stroke="#ffb000" stroke-width="1.5"/>
<text x="134" y="223" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">Slot 1 record</text>
<text x="380" y="223" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="end">4 KiB</text>
<text x="408" y="223" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">Slot 1's length and CRC-32.</text>
<text x="20" y="249" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">0x0F000</text>
<rect x="122" y="232" width="268" height="22" rx="4" fill="#ffb000" fill-opacity="0.16" stroke="#ffb000" stroke-width="1.5"/>
<text x="134" y="249" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">Slot 2 record</text>
<text x="380" y="249" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="end">4 KiB</text>
<text x="408" y="249" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">Slot 2's length and CRC-32.</text>
<text x="20" y="275" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">0x10000</text>
<rect x="122" y="258" width="268" height="62" rx="4" fill="#ff5a4d" fill-opacity="0.16" stroke="#ff5a4d" stroke-width="1.5"/>
<text x="134" y="275" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">Slot 1</text>
<text x="380" y="275" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="end">476 KiB</text>
<text x="408" y="275" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">A bootloader image. Its first part is the front,</text>
<text x="408" y="292" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">which holds recovery, so recovery is in every image.</text>
<text x="408" y="309" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">Written only on request, never the slot that runs.</text>
<text x="20" y="341" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">0x87000</text>
<rect x="122" y="324" width="268" height="22" rx="4" fill="#7bd88f" fill-opacity="0.16" stroke="#7bd88f" stroke-width="1.5"/>
<text x="134" y="341" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">Slot 1 start log</text>
<text x="380" y="341" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="end">4 KiB</text>
<text x="408" y="341" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">One bit cleared at each start. Erased every 256 or more.</text>
<text x="20" y="367" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">0x88000</text>
<rect x="122" y="350" width="268" height="62" rx="4" fill="#ff5a4d" fill-opacity="0.16" stroke="#ff5a4d" stroke-width="1.5"/>
<text x="134" y="367" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">Slot 2</text>
<text x="380" y="367" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="end">472 KiB</text>
<text x="408" y="367" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">The second image. A new image goes into the slot</text>
<text x="408" y="384" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">that is not running and is read back before the</text>
<text x="408" y="401" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">selector names it.</text>
<text x="20" y="433" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">0xFE000</text>
<rect x="122" y="416" width="268" height="22" rx="4" fill="#6cb6ff" fill-opacity="0.16" stroke="#6cb6ff" stroke-width="1.5"/>
<text x="134" y="433" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">Boot store</text>
<text x="380" y="433" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="end">4 KiB</text>
<text x="408" y="433" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">The Start in boot menu setting.</text>
<text x="20" y="459" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">0xFF000</text>
<rect x="122" y="442" width="268" height="22" rx="4" fill="#7bd88f" fill-opacity="0.16" stroke="#7bd88f" stroke-width="1.5"/>
<text x="134" y="459" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">Slot 2 start log</text>
<text x="380" y="459" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="end">4 KiB</text>
<text x="408" y="459" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">As Slot 1's.</text>
<text x="20" y="481" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">0x100000</text>
<text x="122" y="481" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">the end of the flash</text>
<text x="20" y="514" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">To scale: the two slots are 93% of the flash</text>
<rect x="20" y="522" width="820" height="22" rx="3" fill="#151517"/>
<rect x="20.00" y="522" width="34.63" height="22" fill="#5f5f66" fill-opacity="0.85"/>
<rect x="55.23" y="522" width="2.60" height="22" fill="#6cb6ff" fill-opacity="0.85"/>
<rect x="58.44" y="522" width="2.60" height="22" fill="#6cb6ff" fill-opacity="0.85"/>
<rect x="61.64" y="522" width="2.60" height="22" fill="#ffb000" fill-opacity="0.85"/>
<rect x="64.84" y="522" width="2.60" height="22" fill="#ffb000" fill-opacity="0.85"/>
<rect x="68.05" y="522" width="2.60" height="22" fill="#ffb000" fill-opacity="0.85"/>
<rect x="71.25" y="522" width="380.57" height="22" fill="#ff5a4d" fill-opacity="0.85"/>
<rect x="452.42" y="522" width="2.60" height="22" fill="#7bd88f" fill-opacity="0.85"/>
<rect x="455.62" y="522" width="377.37" height="22" fill="#ff5a4d" fill-opacity="0.85"/>
<rect x="833.59" y="522" width="2.60" height="22" fill="#6cb6ff" fill-opacity="0.85"/>
<rect x="836.80" y="522" width="2.60" height="22" fill="#7bd88f" fill-opacity="0.85"/>
</svg>
