<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 522" width="860" height="522" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="The eMMC">
<rect width="860" height="522" rx="10" fill="#0b0b0c"/>
<text x="20" y="34" fill="#ececec" font-size="17" font-weight="700" text-anchor="start">The eMMC</text>
<text x="20" y="54" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">The OS and everything it stores. The bootloader itself is not here: it is in the SPI flash.</text>
<line x1="20" y1="66" x2="840" y2="66" stroke="#2c2c30"/>
<text x="20" y="99" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">BP1</text>
<rect x="122" y="82" width="268" height="62" rx="4" fill="#ff5a4d" fill-opacity="0.16" stroke="#ff5a4d" stroke-width="1.5"/>
<text x="134" y="99" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">Boot partition 1</text>
<text x="134" y="117" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">its size comes from the eMMC</text>
<text x="408" y="99" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">Sector 0: a header (active or not, the image's</text>
<text x="408" y="116" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">length and CRC-32). From sector 1: one OS image.</text>
<text x="20" y="165" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">BP2</text>
<rect x="122" y="148" width="268" height="62" rx="4" fill="#ff5a4d" fill-opacity="0.16" stroke="#ff5a4d" stroke-width="1.5"/>
<text x="134" y="165" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">Boot partition 2</text>
<text x="134" y="183" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">its size comes from the eMMC</text>
<text x="408" y="165" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">The same. A new OS goes into the inactive one</text>
<text x="408" y="182" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">and is switched to last, so a cut leaves the old</text>
<text x="408" y="199" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">OS starting.</text>
<line x1="20" y1="218" x2="840" y2="218" stroke="#2c2c30"/>
<text x="20" y="240" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">The user area, 14.48 GiB</text>
<text x="408" y="240" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">Offsets are sector numbers, 512 bytes each.</text>
<text x="20" y="271" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">0x0000000</text>
<rect x="122" y="254" width="268" height="62" rx="4" fill="#ffb000" fill-opacity="0.16" stroke="#ffb000" stroke-width="1.5"/>
<text x="134" y="271" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">yaffs2 volume</text>
<text x="380" y="271" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="end">2.25 GiB</text>
<text x="408" y="271" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">Shared by the bootloader and the OS: content,</text>
<text x="408" y="288" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">the staging area of an install, the settings file,</text>
<text x="408" y="305" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">and os.ldr for a developer OS write.</text>
<text x="20" y="337" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">0x0480000</text>
<rect x="122" y="320" width="268" height="36" rx="4" fill="#5f5f66" fill-opacity="0.16" stroke="#5f5f66" stroke-width="1.5"/>
<text x="134" y="337" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">Unused</text>
<text x="380" y="337" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="end">4.23 GiB</text>
<text x="408" y="337" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">Never read or written.</text>
<text x="20" y="377" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">0x0CF8000</text>
<rect x="122" y="360" width="268" height="62" rx="4" fill="#6cb6ff" fill-opacity="0.16" stroke="#6cb6ff" stroke-width="1.5"/>
<text x="134" y="377" fill="#ececec" font-size="13" font-weight="700" text-anchor="start">FAT volume</text>
<text x="380" y="377" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="end">8 GiB</text>
<text x="408" y="377" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">The OS's own. The bootloader never mounts it. Its</text>
<text x="408" y="394" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">one write there is a factory reset erasing the</text>
<text x="408" y="411" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">volume's first 512 KiB.</text>
<text x="20" y="439" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">0x1CF8000</text>
<text x="122" y="439" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">the end of the user area</text>
<text x="20" y="472" fill="#9a9aa0" font-size="12" font-weight="400" text-anchor="start">The user area to scale. Each boot partition is a few MiB beside it</text>
<rect x="20" y="480" width="820" height="22" rx="3" fill="#151517"/>
<rect x="20.00" y="480" width="126.78" height="22" fill="#ffb000" fill-opacity="0.85"/>
<rect x="147.38" y="480" width="239.12" height="22" fill="#5f5f66" fill-opacity="0.85"/>
<rect x="387.10" y="480" width="452.30" height="22" fill="#6cb6ff" fill-opacity="0.85"/>
</svg>
